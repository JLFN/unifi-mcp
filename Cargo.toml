[package]
name = "unifi-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "UniFi Network API MCP server: diagnostics, security, and firewall tooling with a safe read-only default"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["mcp", "unifi", "network", "firewall", "diagnostics", "security"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.1.0", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
strip = true
